
general {
    immediate_render = true
}

animations {
    enabled = true
    animation = fadeIn, 0, 1, linear
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
    }
}

background {
    path = ~/.config/hypr/wallpaper.jpg
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    fade_on_empty = true

    font_color = rgb(200, 200, 200)
    inner_color = rgb(50, 50, 60)
    outer_color = rgb(100, 100, 120)

    placeholder_text = <i>Password or fingerprint...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
}

label {
    monitor =
    text = $LAYOUT
    font_size = 14
    color = rgb(200, 200, 200)
    position = 0, -60
    halign = center
    valign = center
}
