font_family             Monaspace Neon NF Light
bold_font               Monaspace Xenon NF Light
italic_font             Monaspace Radon NF Light Italic
bold_italic_font        Monaspace Krypton NF Light
font_size               12.0

cursor                  #ff0080
cursor_text_color       #fff
cursor_blink_interval   0

window_border_width     0
window_margin_width     0
window_padding_width    4
draw_minimal_borders    no

background              #000
foreground              #fff

selection_foreground    #fff
selection_background    #ff0080

inactive_text_alpha     0.5

confirm_os_window_close 0
enable_audio_bell       no
